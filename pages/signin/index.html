<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sign in - OneAtlas</title>
  <link rel="stylesheet" href="../../shared/css/base.css">
  <link rel="stylesheet" href="../signup/style.css"> <!-- Reusing signup styles -->
  <style>
    /* Minor overrides for sign in specific elements */
    .forgot-link {
      display: block;
      text-align: right;
      font-size: 0.85rem;
      color: var(--color-primary);
      margin-top: 0.5rem;
      font-weight: 500;
    }
    .forgot-link:hover { text-decoration: underline; }
    .auth-header { text-align: center; }
  </style>
</head>
<body>
  <div class="split-layout">
    <!-- Left Section -->
    <div class="left-section">
      <div class="brand">
        <svg width="24" height="24" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
          <circle cx="12" cy="12" r="12" fill="url(#paint0_linear)"/>
          <path d="M12 4C7.58172 4 4 7.58172 4 12C4 16.4183 7.58172 20 12 20" stroke="white" stroke-width="2" stroke-linecap="round"/>
          <defs>
            <linearGradient id="paint0_linear" x1="0" y1="0" x2="24" y2="24" gradientUnits="userSpaceOnUse">
              <stop stop-color="#5A32FA"/>
              <stop offset="1" stop-color="#FF3366"/>
            </linearGradient>
          </defs>
        </svg>
        <span class="logo-text">OneAtlas</span>
      </div>

      <div class="content-wrapper">
        <span class="badge badge-beta"><span class="dot"></span> Now in public beta</span>
        <h1 class="heading">Software creation for <span class="text-gradient">modern teams</span></h1>
        <p class="description">Describe workflows, dashboards, or internal tools. OneAtlas builds and deploys them for you.</p>
      </div>

      <!-- Glowing Orb Background Effect -->
      <div class="visual-bg">
        <div class="orb large-orb"></div>
        <div class="stars">
          <div class="star" style="top: 20%; left: 80%; background: #ff3366;"></div>
          <div class="star" style="top: 40%; left: 20%; background: #5a32fa;"></div>
          <div class="star" style="top: 70%; left: 90%; background: #10b981;"></div>
          <div class="star" style="top: 10%; left: 30%; background: #f59e0b;"></div>
        </div>
      </div>
    </div>

    <!-- Right Section -->
    <div class="right-section">
      <div class="auth-card">
        <div class="auth-header">
          <h2>Welcome back</h2>
          <p>Sign in to continue to OneAtlas.</p>
        </div>

        <form class="auth-form" action="#" method="POST">
          <div class="form-group">
            <label for="email">Email</label>
            <div class="input-wrapper">
              <svg class="input-icon" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M4 4h16c1.1 0 2 .9 2 2v12c0 1.1-.9 2-2 2H4c-1.1 0-2-.9-2-2V6c0-1.1.9-2 2-2z"/><polyline points="22,6 12,13 2,6"/></svg>
              <input type="email" id="email" placeholder="you@example.com">
            </div>
          </div>
          <div class="form-group">
            <label for="password">Password</label>
            <div class="input-wrapper">
              <svg class="input-icon" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="11" width="18" height="11" rx="2" ry="2"/><path d="M7 11V7a5 5 0 0 1 10 0v4"/></svg>
              <input type="password" id="password" placeholder="Enter your password">
              <button type="button" class="toggle-password">
                <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/><circle cx="12" cy="12" r="3"/><line x1="1" y1="1" x2="23" y2="23"/></svg>
              </button>
            </div>
            <a href="#" class="forgot-link">Forgot password?</a>
          </div>
          <button type="submit" class="btn btn-primary w-full submit-btn">Sign in</button>
        </form>

        <div class="divider">
          <span>or continue with</span>
        </div>

        <div class="social-login">
          <button class="social-btn"><img src="../../shared/assets/google.svg" alt="Google" width="24"></button>
          <button class="social-btn"><img src="../../shared/assets/github.svg" alt="GitHub" width="24"></button>
          <button class="social-btn"><img src="../../shared/assets/apple.svg" alt="Apple" width="24"></button>
          <button class="social-btn"><img src="../../shared/assets/microsoft.svg" alt="Microsoft" width="24"></button>
          <button class="social-btn"><img src="../../shared/assets/slack.svg" alt="Slack" width="24"></button>
          <button class="social-btn"><img src="../../shared/assets/discord.svg" alt="Discord" width="24"></button>
          <button class="social-btn sso-btn">
            <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"/></svg>
            <span>SSO</span>
          </button>
        </div>

        <p class="switch-auth">Don't have an account? <a href="../signup/index.html">Sign up</a></p>
      </div>
    </div>
  </div>
  <script src="../../shared/js/auth.js"></script>
<script src="../../shared/js/theme.js"></script>
</body>
</html>
