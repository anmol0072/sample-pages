<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>OneAtlas Subpages Demo</title>
  <link rel="stylesheet" href="./shared/css/base.css">
  <style>
    body {
      margin: 0;
      padding: 0;
      height: 100vh;
      display: flex;
      flex-direction: column;
      overflow: hidden;
      background: var(--color-bg);
    }
    .demo-header {
      background: var(--color-bg-alt);
      border-bottom: 1px solid var(--color-border);
      padding: 0.75rem 1.5rem;
      display: flex;
      justify-content: space-between;
      align-items: center;
      flex-shrink: 0;
      z-index: 100;
    }
    .demo-title {
      font-weight: 700;
      font-size: 1.1rem;
      display: flex;
      align-items: center;
      gap: 0.5rem;
    }
    .badge-preview {
      background: var(--gradient-primary);
      color: white;
      font-size: 0.7rem;
      padding: 0.15rem 0.4rem;
      border-radius: var(--radius-sm);
    }
    .demo-nav {
      display: flex;
      gap: 0.5rem;
    }
    .demo-nav-btn {
      padding: 0.4rem 0.8rem;
      border-radius: var(--radius-md);
      font-size: 0.85rem;
      font-weight: 500;
      border: 1px solid transparent;
      background: transparent;
      color: var(--color-text-muted);
      transition: all 0.2s;
    }
    .demo-nav-btn:hover {
      background: rgba(0,0,0,0.05);
      color: var(--color-text);
    }
    .demo-nav-btn.active {
      background: white;
      border-color: var(--color-border);
      color: var(--color-primary);
      box-shadow: var(--shadow-sm);
    }
    .demo-frame-container {
      flex: 1;
      position: relative;
      background: #e5e7eb;
    }
    iframe {
      width: 100%;
      height: 100%;
      border: none;
      display: block;
    }
    
    [data-theme="dark"] .demo-header {
      background: #010409;
    }
    [data-theme="dark"] .demo-nav-btn:hover {
      background: rgba(255,255,255,0.1);
    }
    [data-theme="dark"] .demo-nav-btn.active {
      background: #161b22;
    }
  </style>
</head>
<body>
  <header class="demo-header">
    <div class="demo-title">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
        <circle cx="12" cy="12" r="12" fill="url(#paint0_linear)"/>
        <path d="M12 4C7.58172 4 4 7.58172 4 12C4 16.4183 7.58172 20 12 20" stroke="white" stroke-width="2" stroke-linecap="round"/>
        <defs>
          <linearGradient id="paint0_linear" x1="0" y1="0" x2="24" y2="24" gradientUnits="userSpaceOnUse">
            <stop stop-color="#5A32FA"/><stop offset="1" stop-color="#FF3366"/>
          </linearGradient>
        </defs>
      </svg>
      OneAtlas <span class="badge-preview">TEAM LEAD DEMO</span>
    </div>
    
    <nav class="demo-nav">
      <button class="demo-nav-btn active" data-src="./pages/docs/index.html">Docs</button>
      <button class="demo-nav-btn" data-src="./pages/pricing/index.html">Pricing</button>
      <button class="demo-nav-btn" data-src="./pages/security/index.html">Security</button>
      <button class="demo-nav-btn" data-src="./pages/blog/index.html">Blog</button>
      <button class="demo-nav-btn" data-src="./pages/support/index.html">Support</button>
      <button class="demo-nav-btn" data-src="./pages/signin/index.html">Sign In</button>
      <button class="demo-nav-btn" data-src="./pages/signup/index.html">Sign Up</button>
    </nav>
    
    <div>
      <button class="theme-toggle" aria-label="Toggle Dark Mode" style="display:flex;align-items:center;justify-content:center;width:34px;height:34px;border-radius:50%;background:var(--color-bg);border:1px solid var(--color-border);color:var(--color-text-muted);cursor:pointer;transition:all 0.2s ease;">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <circle cx="12" cy="12" r="5"></circle>
          <line x1="12" y1="1" x2="12" y2="3"></line>
          <line x1="12" y1="21" x2="12" y2="23"></line>
          <line x1="4.22" y1="4.22" x2="5.64" y2="5.64"></line>
          <line x1="18.36" y1="18.36" x2="19.78" y2="19.78"></line>
          <line x1="1" y1="12" x2="3" y2="12"></line>
          <line x1="21" y1="12" x2="23" y2="12"></line>
          <line x1="4.22" y1="19.78" x2="5.64" y2="18.36"></line>
          <line x1="18.36" y1="5.64" x2="19.78" y2="4.22"></line>
        </svg>
      </button>
    </div>
  </header>

  <div class="demo-frame-container">
    <iframe id="main-frame" src="./pages/docs/index.html" title="Preview Frame"></iframe>
  </div>

  <script src="./shared/js/theme.js"></script>
  <script>
    const buttons = document.querySelectorAll('.demo-nav-btn');
    const iframe = document.getElementById('main-frame');

    buttons.forEach(btn => {
      btn.addEventListener('click', () => {
        // Remove active class from all
        buttons.forEach(b => b.classList.remove('active'));
        // Add to clicked
        btn.classList.add('active');
        // Update iframe
        iframe.src = btn.getAttribute('data-src');
      });
    });
  </script>
</body>
</html>
